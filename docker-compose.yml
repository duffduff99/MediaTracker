# MediaTracker — one container, one data volume.
# Put it behind your reverse proxy (HTTPS is required for barcode scanning and installing on a phone).
services:
  mediatracker:
    image: ghcr.io/duffduff99/mediatracker:latest
    # To build on the server instead of pulling from GitHub, comment out `image:` and uncomment:
    # build: .
    container_name: mediatracker
    restart: unless-stopped
    ports:
      - "8080:8080"          # point your reverse proxy at this port
    volumes:
      - ./data:/data         # database + nightly backups live here — back this folder up
    environment:
      TZ: America/Chicago                  # your time zone (used for backup file names)
      # MT_ADMIN_PASSWORD: change-me-now   # optional: first-start admin password (otherwise one is printed in the logs)
      # MT_BACKUP_KEEP: "14"               # nightly backups to keep
      # MT_TRASH_DAYS: "30"                # days deleted items stay in the trash
